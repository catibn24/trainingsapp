<title>Triphasic</title>
<style>
/* Layout: sticky header with a 12-week strip, day tabs, then one column of exercise cards (animated figure | prescription + log). */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#121a24; --muted:#5b6878; --line:#d5dce4;
  --accent:#1f4fd6; --accent-ink:#ffffff;
  --ecc:#2463eb; --iso:#c98a06; --con:#d63b2f; --spd:#7a3fd1; --peak:#11875d;
  --good:#11875d; --warn:#c2410c;
  --figure:#121a24; --figure-back:#9aa6b4; --prop:#5b6878;
  --display:"Avenir Next Condensed","Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1217; --surface:#151c24; --surface-2:#1b242e; --ink:#e7edf3; --muted:#93a1b1; --line:#2a3542;
  --accent:#6f95ff; --accent-ink:#0d1217;
  --ecc:#6f95ff; --iso:#f0b429; --con:#ff6b5e; --spd:#b38bff; --peak:#3fcf8e;
  --good:#3fcf8e; --warn:#ff8a4c;
  --figure:#e7edf3; --figure-back:#5d6b7b; --prop:#93a1b1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1217; --surface:#151c24; --surface-2:#1b242e; --ink:#e7edf3; --muted:#93a1b1; --line:#2a3542;
  --accent:#6f95ff; --accent-ink:#0d1217;
  --ecc:#6f95ff; --iso:#f0b429; --con:#ff6b5e; --spd:#b38bff; --peak:#3fcf8e;
  --good:#3fcf8e; --warn:#ff8a4c;
  --figure:#e7edf3; --figure-back:#5d6b7b; --prop:#93a1b1; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;line-height:1;text-transform:uppercase}
.brand h1 span{color:var(--muted);font-weight:500}
.nav{display:flex;gap:6px}
.nav button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:5px 12px;cursor:pointer;font-weight:500;font-size:14px}
.nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.weeks{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.wk{border:0;border-radius:5px;padding:6px 0 5px;cursor:pointer;background:var(--surface-2);font-family:var(--display);font-weight:600;font-size:16px;position:relative;line-height:1}
.wk::after{content:"";position:absolute;left:6px;right:6px;bottom:2px;height:3px;border-radius:2px;background:var(--c)}
.wk[aria-pressed="true"]{background:var(--c);color:var(--bg)}
.wk[aria-pressed="true"]::after{background:var(--bg);opacity:.6}
.wk .dot{position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--good)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
main .wrap{padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
.banner{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline}
.banner .num{font-family:var(--display);font-size:54px;font-weight:700;line-height:.85;color:var(--c);grid-row:span 2}
.banner h2{font-family:var(--display);font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.banner p{margin:0;color:var(--muted);max-width:62ch}
.days{display:flex;gap:6px;flex-wrap:wrap}
.day{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;min-width:0;flex:1 1 120px}
.day b{display:block;font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.day small{color:var(--muted);font-size:12px}
.day[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.day.run{border-style:dashed}
.day .logged{color:var(--good);font-weight:600}
.status{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.status .pip{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status.ok .pip{background:var(--good)}
.status.local .pip{background:var(--iso)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:150px minmax(0,1fr);overflow:hidden}
.fig{background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:14px;padding:8px 6px;gap:4px}
.fig svg{width:100%;max-width:140px;height:auto;display:block}
.fig .phase{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;min-height:1.3em}
.body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ex-head h3{margin:0;font-size:17px;font-weight:600;line-height:1.25}
.ex-head .tag{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rx{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:4px;padding:2px 7px;background:var(--surface-2);white-space:nowrap}
.chip.kg{border-color:var(--accent);color:var(--accent);font-weight:500}
.chip.tempo{border-color:var(--c,var(--line))}
.note{font-size:13.5px;color:var(--muted);margin:0}
.links{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13.5px;align-items:center}
.links a.vid{font-weight:600;text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:3px 10px}
.howto{border-top:1px solid var(--line);padding-top:6px}
.howto summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent);list-style:none;display:flex;align-items:center;gap:6px}
.howto summary::-webkit-details-marker{display:none}
.howto summary::before{content:"▸";transition:transform .15s}
.howto[open] summary::before{transform:rotate(90deg)}
.howto ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14px;line-height:1.45}
.ev-note{font-size:13px;color:var(--muted);margin:8px 0 0;font-style:italic}
.ev{margin-top:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.ev-h{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.ev p{margin:0;font-size:13px;line-height:1.45}
.ev a{overflow-wrap:anywhere}
.log{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;padding:2px 4px}
td{padding:3px 4px;vertical-align:middle}
td.n{font-family:var(--mono);font-size:12px;color:var(--muted);width:28px}
input.v{width:100%;min-width:56px;max-width:96px;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:6px 7px;font-family:var(--mono);font-size:16px}
input.v::placeholder{color:var(--muted);opacity:.6}
td.calc{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
td.calc.flag{color:var(--warn);font-weight:500}
td.calc.best{color:var(--good);font-weight:500}
.mini{border:1px solid var(--line);background:var(--surface-2);border-radius:5px;padding:4px 8px;font-size:12px;cursor:pointer;white-space:nowrap;font-family:var(--mono)}
.mini.run{background:var(--con);color:#fff;border-color:var(--con)}
.result{font-size:13.5px;border-top:1px dashed var(--line);padding-top:7px;display:flex;gap:4px 14px;flex-wrap:wrap}
.result b{font-family:var(--mono);font-weight:500}
.result .warn{color:var(--warn)}
.result .good{color:var(--good)}
.addset{align-self:flex-start}
.summary{background:var(--ink);color:var(--bg);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.summary div span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;opacity:.7}
.summary div b{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--display);text-transform:uppercase;font-size:22px;margin:0;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;font-family:var(--mono);font-size:16px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.tbl{overflow-x:auto}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:6px 8px;font-size:13.5px}
.tbl td{font-family:var(--mono)}
.empty{color:var(--muted);font-size:14px}
.cond{grid-template-columns:150px minmax(0,1fr)}
@media (max-width:560px){
  header.top{position:static}
  body::before{display:none}
  .card{grid-template-columns:96px minmax(0,1fr)}
  .fig svg{max-width:88px}
  .body{padding:10px}
  .banner .num{font-size:42px}
  .weeks{gap:3px}
  .wk{font-size:14px}
  input.v{min-width:48px;padding:5px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head><body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Triphasic <span>12-week log</span></h1>
      <div class="nav" role="tablist">
        <button id="nav-train" aria-pressed="true">Train</button>
        <button id="nav-progress" aria-pressed="false">Progress</button>
        <button id="nav-settings" aria-pressed="false">Maxes</button>
      </div>
    </div>
    <div class="weeks" id="weeks"></div>
    <div class="legend">
      <span><i style="background:var(--ecc)"></i>Eccentric</span>
      <span><i style="background:var(--iso)"></i>Isometric</span>
      <span><i style="background:var(--con)"></i>Concentric</span>
      <span><i style="background:var(--spd)"></i>55–80% speed-strength</span>
      <span><i style="background:var(--peak)"></i>&lt;55% peaking</span>
    </div>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>

<script>
/* ---------------- utilities ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : null; };
const round25 = x => Math.round(x / 2.5) * 2.5;
const fmt = (x, d = 1) => x == null ? "–" : (Math.round(x * 10 ** d) / 10 ** d).toString();
const pad = n => String(n).padStart(2, "0");

/* ---------------- stick-figure poses (side view, facing right) ---------------- */
const STAND = {h:[50,13],s:[50,23],e:[50,37],w:[50,50],p:[50,51],k:[51,71],a:[50,90],t:[57,91]};

const POSES = {
  squat:{A:P({e:[43,30],w:[48,22],bar:[48,22]}),B:P({h:[65,41],s:[59,49],e:[51,54],w:[57,47],p:[41,70],k:[60,73],bar:[57,47]}),props:["plate"],ecc:"AB"},
  hinge:{A:P({e:[51,37],w:[52,50],bar:[52,51]}),B:P({p:[42,52],k:[49,71],s:[68,42],h:[77,39],e:[68,52],w:[67,62],bar:[67,63]}),props:["plate"],ecc:"AB"},
  deadlift:{A:P({e:[51,37],w:[52,50],bar:[52,51]}),B:P({p:[42,64],k:[60,73],s:[63,46],h:[71,40],e:[63,58],w:[62,70],bar:[62,71]}),props:["plate"],ecc:"AB"},
  lunge:{A:P({e:[49,37],w:[49,50],p:[50,51],k:[58,70],a:[60,90],t:[67,91],k2:[42,70],a2:[34,88],t2:[38,91]}),
         B:P({h:[50,23],s:[50,33],e:[49,47],w:[49,60],p:[50,61],k:[66,70],a:[60,90],t:[67,91],k2:[42,80],a2:[28,88],t2:[32,91]}),props:["db"],ecc:"AB"},
  bench:{A:{h:[20,63],s:[28,66],e:[29,54],w:[29,42],bar:[29,42],p:[58,67],k:[72,62],a:[76,90],t:[82,91]},
         B:{h:[20,63],s:[28,66],e:[36,73],w:[31,59],bar:[31,59],p:[58,67],k:[72,62],a:[76,90],t:[82,91]},props:["plate","bench"],ecc:"AB"},
  dbpress:{A:{h:[20,63],s:[28,66],e:[29,54],w:[29,42],p:[58,67],k:[72,62],a:[76,90],t:[82,91]},
         B:{h:[20,63],s:[28,66],e:[36,73],w:[33,60],p:[58,67],k:[72,62],a:[76,90],t:[82,91]},props:["db","bench"],ecc:"AB"},
  row:{A:P({p:[42,52],k:[49,71],s:[68,42],h:[77,39],e:[68,54],w:[68,66]}),B:P({p:[42,52],k:[49,71],s:[68,42],h:[77,39],e:[58,40],w:[63,52]}),props:["db"],ecc:"BA"},
  pullup:{A:{h:[46,15],s:[50,23],e:[52,13],w:[52,4],p:[50,51],k:[52,70],a:[50,86],t:[56,88]},
          B:{h:[47,1],s:[50,10],e:[40,14],w:[52,4],p:[50,38],k:[52,57],a:[50,73],t:[56,75]},props:["pullbar","nofloor"],ecc:"BA"},
  press:{A:P({e:[43,30],w:[50,22],bar:[50,22]}),B:P({e:[52,6],w:[51,-4],bar:[51,-4]}),props:["plate"],ecc:"BA"},
  jump:{A:P({h:[63,37],s:[57,44],e:[47,52],w:[38,58],p:[42,66],k:[60,72]}),B:{h:[50,-2],s:[50,8],e:[56,-2],w:[58,-11],p:[50,36],k:[52,55],a:[50,73],t:[55,78]},props:[],ecc:"jump"},
  hurdle:{A:P({h:[45,37],s:[39,44],e:[29,52],w:[22,58],p:[24,66],k:[42,72],a:[32,90],t:[39,91]}),B:{h:[58,-2],s:[58,8],e:[64,-2],w:[66,-11],p:[58,36],k:[62,54],a:[56,70],t:[62,72]},props:["hurdle"],ecc:"jump"},
  dbjump:{A:P({h:[63,37],s:[57,44],e:[57,58],w:[57,68],p:[42,66],k:[60,72]}),B:{h:[50,-2],s:[50,8],e:[50,22],w:[50,35],p:[50,36],k:[52,55],a:[50,73],t:[55,78]},props:["db"],ecc:"jump"},
  clean:{A:P({h:[66,27],s:[60,34],e:[59,47],w:[58,59],bar:[58,60],p:[42,56],k:[55,72]}),B:P({h:[56,28],s:[53,37],e:[63,38],w:[56,33],bar:[55,33],p:[42,63],k:[59,71]}),props:["plate"],ecc:"jump"},
  sprint:{A:{h:[70,18],s:[64,27],e:[56,36],w:[60,46],e2:[70,36],w2:[76,28],p:[50,50],k:[66,54],a:[62,72],t:[68,73],k2:[46,70],a2:[34,84],t2:[39,88]},
          B:{h:[70,18],s:[64,27],e:[70,36],w:[76,28],e2:[56,36],w2:[60,46],p:[50,50],k:[48,70],a:[36,84],t:[41,88],k2:[66,54],a2:[62,72],t2:[68,73]},props:[],ecc:"run"},
  plank:{A:{h:[20,66],s:[28,70],e:[28,84],w:[38,86],p:[58,73],k:[72,79],a:[86,86],t:[88,90]},B:{h:[20,65],s:[28,69],e:[28,84],w:[38,86],p:[58,72],k:[72,79],a:[86,86],t:[88,90]},props:[],ecc:"hold"},
  nordic:{A:{h:[40,27],s:[40,36],e:[46,44],w:[50,38],p:[40,62],k:[40,88],a:[18,88],t:[14,85]},B:{h:[79,41],s:[73,48],e:[78,58],w:[84,54],p:[57,68],k:[40,88],a:[18,88],t:[14,85]},props:[],ecc:"AB"},
  calf:{A:P({}),B:P({h:[50,8],s:[50,18],e:[50,32],w:[50,45],p:[50,46],k:[51,66],a:[50,85]}),props:["db"],ecc:"BA"},
  throw:{A:P({h:[57,23],s:[54,32],e:[46,40],w:[54,36],ball:[57,36],p:[46,58],k:[57,73]}),B:P({h:[62,24],s:[58,32],e:[68,32],w:[78,30],ball:[82,30],p:[48,57],k:[56,73]}),props:["ball"],ecc:"jump"},
  bike:{A:{h:[60,20],s:[55,29],e:[63,36],w:[71,38],p:[40,50],k:[54,44],a:[50,62],t:[55,63],k2:[48,60],a2:[44,76],t2:[49,77]},
        B:{h:[60,20],s:[55,29],e:[63,36],w:[71,38],p:[40,50],k:[48,60],a:[44,76],t:[49,77],k2:[54,44],a2:[50,62],t2:[55,63]},props:["bikeframe"],ecc:"run"},
  pushup:{A:{h:[22,58],s:[30,62],e:[30,74],w:[30,88],p:[58,70],k:[72,78],a:[86,86],t:[88,90]},B:{h:[24,76],s:[32,78],e:[42,76],w:[30,88],p:[60,80],k:[73,83],a:[86,87],t:[88,90]},props:[],ecc:"AB"},
};
const lerp = (a, b, u) => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
function poseAt(name, u){
  const P0 = POSES[name], o = {};
  for (const k of Object.keys(P0.A)) o[k] = lerp(P0.A[k], P0.B[k] || P0.A[k], u);
  for (const k of ["k","a","t","e","w"]) if (!o[k + "2"]) o[k + "2"] = o[k];
  return o;
}
function figureSVG(id, name){
  const props = POSES[name].props;
  let s = `<svg viewBox="0 -14 100 108" aria-hidden="true" id="${id}">`;
  if (!props.includes("nofloor")) s += `<line x1="4" y1="91.5" x2="96" y2="91.5" stroke="var(--line)" stroke-width="1.5"/>`;
  if (props.includes("bench")) s += `<rect x="16" y="69" width="56" height="5" rx="1.5" fill="var(--prop)"/><rect x="22" y="74" width="3" height="17" fill="var(--prop)"/><rect x="64" y="74" width="3" height="17" fill="var(--prop)"/>`;

function timeline(name, tempo){
  const kind = POSES[name].ecc;
  const fast = 0.6;
  if (kind === "jump") return [["A",0.7,"load"],["AB",0.35,"explode"],["B",0.15,""],["BA",0.45,"land"],["A",0.5,""]];
  if (kind === "run") return [["AB",0.32,""],["BA",0.32,""]];
  if (kind === "hold") return [["AB",1.6,"hold"],["BA",1.6,"hold"]];
  const [e, i, c, r] = (tempo || "2:0:1:1").split(":").map(Number);
  const ecc = e > 0 ? e : 1.0, iso = i > 0 ? i : 0.15, con = c > 0 ? c : fast, rest = r > 0 ? r : 0.7;
  const lowE = e > 0 ? `eccentric ${e}s` : "lower", lowI = i > 0 ? `pause ${i}s` : "", up = "explode";
  return kind === "AB"

}

let figs = [];
function animate(t){
  for (const f of figs){
    const total = f.tl.reduce((s, x) => s + x[1], 0);
    let x = ((t / 1000) % total), u = 0, label = "";
    for (const [seg, d, lab] of f.tl){
      if (x <= d){
        const q = d ? x / d : 1, sm = q * q * (3 - 2 * q);
        u = seg === "A" ? 0 : seg === "B" ? 1 : seg === "AB" ? sm : 1 - sm; label = lab; break;
      }
      x -= d;
    }
    drawPose(f.svg, f.pose, u);
    if (f.lab && f.lab.textContent !== label) f.lab.textContent = label || " ";
  }
  if (!reduceMotion) requestAnimationFrame(animate);
}

function exportData(){
  const data = JSON.stringify({app:"triphasic", version:1, exported:new Date().toISOString(), profile:state.profile, sessions:state.sessions}, null, 1);
  const name = `triphasic-backup-${new Date().toISOString().slice(0,10)}.json`;
  const file = new File([data], name, {type:"application/json"});
  const done = () => { try { localStorage.setItem(LS + "-backup", new Date().toISOString()); } catch(e){} setStatus(); };
  if (navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:name}).then(done).catch(() => {});
  } else {

  }
}
function importData(f){

    const msg = $("#importmsg");
    try {
      const d = JSON.parse(r.result);
      if (d.app !== "triphasic" || !d.sessions) throw 0;
      state.profile = {...DEFAULT_PROFILE, ...(d.profile || {})};
      state.sessions = {...state.sessions, ...d.sessions};

function runTimer(btn, e, w, d, n){

      const l = ensureLog(w, d, e.id, Math.max(n, i + 1)); l.sets[i].sec = secs.toFixed(2);
      const inp = btn.closest("tr").querySelector('input[data-k="sec"]'); inp.value = l.sets[i].sec;
      btn.classList.remove("run"); btn.textContent = "again";
      updateResults(e, w, d); renderSummary(w, d, program(w, d).list); scheduleSave(sid(w, d));
    } else { cancelAnimationFrame(activeTimer.raf); activeTimer = null; btn.classList.remove("run"); btn.textContent = e.secs + " s"; }
    return;

function render(){
  renderWeeks();
  ["train","progress","settings"].forEach(v => $("#nav-" + v).setAttribute("aria-pressed", String(state.view === v)));
  figs = [];
  if (state.view === "train") renderTrain(); else if (state.view === "settings") renderSettings(); else renderProgress();
}
$("#weeks").addEventListener("click", ev => { const b = ev.target.closest(".wk"); if (!b) return; state.week = +b.dataset.w; state.view = "train"; cacheLocal(); render(); window.scrollTo({top:0}); });
$("#nav-train").onclick = () => { state.view = "train"; render(); };
$("#nav-progress").onclick = () => { state.view = "progress"; render(); };
$("#nav-settings").onclick = () => { state.view = "settings"; render(); };

render();
requestAnimationFrame(animate);
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body></html>
